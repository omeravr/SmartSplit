<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSplit - Expense Sharing Made Easy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="public/css/styles.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">SmartSplit</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showTab('dashboard')">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showTab('expense')">Add Expense</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showTab('settlements')">Settlements</a>
                    </li>
                </ul>
                <div class="navbar-nav">
                    <div data-auth="unauthenticated">
                        <button class="btn btn-outline-light" onclick="showWelcomeModal()">Sign In</button>
                    </div>
                    <div data-auth="authenticated" class="d-flex align-items-center">
                        <span class="text-light me-3" data-user-info="name"></span>
                        <button class="btn btn-outline-light" onclick="window.firebaseAuth.signOut()">Sign Out</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        <!-- Dashboard Tab -->
        <div id="dashboard" class="tab-content active">
            <h2>Dashboard</h2>
            <div id="balance-summary" class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Balance Summary</h5>
                    <!-- Balance summary content will be dynamically populated -->
                </div>
            </div>
            <div id="all-balances" class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">All Balances</h5>
                    <!-- All balances content will be dynamically populated -->
                </div>
            </div>
            <div id="recent-activity" class="card">
                <div class="card-body">
                    <h5 class="card-title">Recent Activity</h5>
                    <!-- Recent activity content will be dynamically populated -->
                </div>
            </div>
        </div>

        <!-- Add Expense Tab -->
        <div id="expense" class="tab-content">
            <h2>Add Expense</h2>
            <form id="expense-form" class="card">
                <div class="card-body">
                    <!-- Expense form content will be dynamically populated -->
                </div>
            </form>
        </div>

        <!-- Settlements Tab -->
        <div id="settlements" class="tab-content">
            <h2>Settlements</h2>
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Record Settlement</h5>
                    <form id="settlement-form">
                        <!-- Settlement form content will be dynamically populated -->
                    </form>
                </div>
            </div>
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Settlement History</h5>
                    <!-- Settlement history content will be dynamically populated -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="public/js/firebase-config.js"></script>
    <script src="public/js/firebase-auth.js"></script>
    <script src="public/js/app.js"></script>
</body>
</html>
